[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "velo-supervisor-2000"
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.11.3",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "peewee>=4.5.1",
    "python-multipart>=0.0.32",
    "requests-oauthlib>=2.0.0",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "time-machine>=3.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.hatch.build.targets.wheel]
packages = ["src/velo_supervisor"]

[tool.hatch.version]
source = "vcs"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]
